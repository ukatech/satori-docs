# 左のメニューの定義（旧 wiki の MenuBar に当たる）。サイトの階層構造の元になるファイルで、
# 左のメニュー・上のパンくずリスト・各節の索引ページが、すべてここから作られる。
#
# 項目の書き方（menu: の下に並べる。children: で下の項目を入れ子にできる。深さは自由）
#   - title: 表示する名前        必須
#     page: 原稿のパス           サイト内のページ。リポジトリ内のパス（`startup/cheatsheet.md`）で書く
#                                `INDEX.md#見出し` のように # でアンカーも付けられる
#                                `grammar/05-kakko.md` や `functions/set.md` のように、まとめた元の原稿も書ける
#                                （まとめたページの、その項目の見出しへのリンクになる）。
#                                分類ごとにまとめたページ（`functions/variables.md` など。scripts/prepare_site.py の
#                                GROUP_PAGES のファイル名）も書ける
#     index: startup/            下の項目の索引ページを自動で作る。その URL（小文字の英数字とハイフン、末尾は /）。
#                                children: と list: に書いたページを並べるだけの、小さなページになる
#     url: https://...           外部のページ
#     children: [...]            下の項目。左のメニューに出て、索引ページにも並ぶ
#     list: other                そのディレクトリの原稿のうち、menu.yml のどこにも載っていないページを、この項目の下に置く。
#                                左のメニューには出さず、索引ページとパンくずリストにだけ使う（数が多いページ向け）。
#                                並びは、ディレクトリに .nav.yml があればその順、残りは各ページの題（H1）の順
#   page: index: url: は、1 項目に 1 つだけ書ける。どれも書かない項目は、リンクの無い見出しになる（下にページを置けない）。
#
# 最上位の項目は、左のメニューでは見出し（下の項目が無いものは 1 行のリンク）になる。
# 原稿は、children: か list: のどこかに必ず載せる（載っていないページがあると、ビルドが止まる）。
# 同じページを何か所に書いてもよいが、パンくずリストは最初に出てくる項目の下になる。
# 原稿のパスやアンカーが違っても、ビルド（oldstyle/build.py）が止まる。表示は、書いた順のまま。
