site_name: 里々マニュアル
site_description: 伺かの SHIORI「里々（SATORI）」と同梱 SAORI「ssu」の仕様書
site_url: https://ukatech.github.io/satori-docs/
repo_url: https://github.com/ukatech/satori-docs
repo_name: ukatech/satori-docs
edit_uri: ""

# 原稿はリポジトリ直下にあるため、scripts/prepare_site.py で _site_src/ に写してからビルドする
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  # OGP などの <head> の追加（overrides/main.html）
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

# ページごとの OGP（overrides/main.html が使う）。キーは原稿のパス、image は site_url からの相対パス（1200x630）
extra:
  ogp:
    other/satori2-prerelease.md:
      title: 里々 Unicode 版 試験版 ─ 動作確認のお願い
      description: 内部を Unicode にした里々（Mc200 系）の試験版です。手元のゴーストで動かして、従来の仕様との違いや不具合を教えてください。
      image: assets/satori2/ogp.png

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: ja
  - awesome-pages

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - mdx_truly_sane_lists
  - pymdownx.superfences
  - toc:
      permalink: true
      # GitHub と同じく日本語の見出しをそのままアンカーにする
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn
